[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2smiles"
version = "0.1.0"
description = "De novo SMILES prediction from LC-MS/MS spectra (MassSpecGym baseline)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MassSpecGym baseline" }]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
rdkit = ["rdkit>=2023.9.1"]
# Official MassSpecGym package (PyTorch Lightning stack). Optional; we have HF TSV fallback.
massspecgym = ["massspecgym @ git+https://github.com/pluskal-lab/MassSpecGym.git"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec2smiles = ["py.typed"]
