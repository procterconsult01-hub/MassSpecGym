# Longer CPU subset: 10k train / 1k val / 5 epochs, beam=5, SELFIES targets
seed: 42
device: cpu

data:
  source: tsv
  tsv_path: data/MassSpecGym1.5.tsv
  hf_repo: roman-bushuiev/MassSpecGym
  hf_file: data/MassSpecGym1.5.tsv
  max_peaks: 100
  max_smiles_len: 128
  mz_bins: 5000
  mz_max: 1000.0
  fold_train: train
  fold_val: val
  max_train_samples: 10000
  max_val_samples: 1000
  decode_mode: selfies  # train/decode in SELFIES space → higher validity

model:
  d_model: 128
  nhead: 4
  num_encoder_layers: 2
  num_decoder_layers: 2
  dim_feedforward: 256
  dropout: 0.1
  peak_embed_dim: 32
  use_precursor_mass: true

train:
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 5
  max_steps: null
  grad_clip: 1.0
  num_workers: 0
  log_every: 20
  checkpoint_dir: artifacts/checkpoints
  checkpoint_name: spec2smiles_cpu_longer.pt

smoke:
  epochs: 2
  max_steps: 20
  batch_size: 8
  max_train_samples: 32
  max_val_samples: 8
  d_model: 64
  nhead: 2
  num_encoder_layers: 1
  num_decoder_layers: 1
  dim_feedforward: 128

infer:
  max_len: 128
  beam_size: 5
  val_beam_size: 1  # greedy during epoch val; final eval uses beam_size 5
  temperature: 1.0
  prefer_valid: true

eval:
  max_samples: 64
