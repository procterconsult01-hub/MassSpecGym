# Enveda CASMI 2026 Kaggle — small smoke / fine-tune (paths for Code Comp)
seed: 42
device: cuda  # notebook overrides to cpu if no GPU

data:
  source: enveda
  enveda_dir: /kaggle/input/enveda-CASMI26-molecule-id-mass-spectra
  max_peaks: 100
  max_smiles_len: 128
  mz_bins: 5000
  mz_max: 2000.0
  fold_train: train
  fold_val: val
  max_train_samples: 5000
  max_val_samples: 500
  decode_mode: selfies  # smiles | selfies

model:
  d_model: 128
  nhead: 4
  num_encoder_layers: 2
  num_decoder_layers: 2
  dim_feedforward: 256
  dropout: 0.1
  peak_embed_dim: 32
  use_precursor_mass: true

train:
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 2
  max_steps: 200
  grad_clip: 1.0
  num_workers: 0
  log_every: 10
  checkpoint_dir: /kaggle/working/checkpoints
  checkpoint_name: enveda_cpu_smoke.pt

smoke:
  epochs: 1
  max_steps: 20
  batch_size: 8
  max_train_samples: 64
  max_val_samples: 16
  d_model: 64
  nhead: 2
  num_encoder_layers: 1
  num_decoder_layers: 1
  dim_feedforward: 128

infer:
  max_len: 128
  beam_size: 5
  temperature: 1.0
  prefer_valid: true
  val_beam_size: 1
  top_k: 25
  fill_smiles: CCO

eval:
  max_samples: 64

kaggle:
  sample_submission: /kaggle/input/enveda-CASMI26-molecule-id-mass-spectra/sample_submission.csv
  test_parquet: /kaggle/input/enveda-CASMI26-molecule-id-mass-spectra/test.parquet
  output: /kaggle/working/submission.csv
